[project]
name = "envy-mcp-hello"
version = "0.1.0"
description = "A tiny public MCP server backed by an Envy-managed Modal sandbox"
requires-python = ">=3.11"
dependencies = [
    "envy[mcp] @ git+https://github.com/aaazzam/envy.git@main",
    "fastmcp==4.0.0b3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b3"]

[tool.setuptools.packages.find]
include = ["envy_mcp_hello*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
