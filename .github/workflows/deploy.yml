name: Deploy MCP server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out the example
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal and Envy
        run: |
          python -m pip install --upgrade pip
          python -m pip install "envy[mcp] @ git+https://github.com/aaazzam/envy.git@main"

      - name: Validate the declaration
        run: python -m compileall -q devboxes.py tests

      - name: Run declaration tests
        run: python -m unittest discover -s tests

      - name: Deploy to Modal
        run: modal deploy devboxes.py

