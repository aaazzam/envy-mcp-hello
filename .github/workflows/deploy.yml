name: Deploy MCP server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out the example
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Modal and Envy
        run: uv sync --locked --dev

      - name: Validate the declaration
        run: uv run python -m compileall -q devboxes.py envy_mcp_hello tests

      - name: Run declaration tests
        run: uv run pytest -q

      - name: Deploy to Modal
        run: uv run modal deploy devboxes.py::modal_app

      - name: Rebake environment images
        run: |
          uv run python - <<'PY'
          import envy
          import devboxes

          runner = envy.ModalRunner(devboxes.app, show_output=True)
          print(runner.rebake())
          PY
